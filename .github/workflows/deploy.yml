name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Known Hosts
        run: ssh-keyscan -H 13.213.12.202 >> ~/.ssh/known_hosts

      - name: Deploy
        run: ssh ubuntu@13.213.12.202 'cd /home/ubuntu/networking_cloud && git pull origin main && sudo docker compose up -d --build && sleep 20 && sudo docker exec wholesale_app python manage.py migrate --noinput && sudo docker exec wholesale_app python manage.py collectstatic --noinput && sudo docker exec wholesale_app python manage.py create_demo_users'

      - name: Health Check
        run: curl -sf http://13.213.12.202:8001/health/
