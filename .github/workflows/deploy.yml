name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 13.213.12.202 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@13.213.12.202 << 'DEPLOY'
            echo "🚀 Starting deployment..."
            cd /home/ubuntu/networking_cloud
            
            git pull origin main
            
            sudo docker compose up -d --build
            
            echo "⏳ Waiting for app..."
            sleep 20
            
            sudo docker exec wholesale_app python manage.py migrate --noinput
            sudo docker exec wholesale_app python manage.py collectstatic --noinput
            sudo docker exec wholesale_app python manage.py create_demo_users
            
            if curl -sf http://localhost:8001/health/ > /dev/null; then
              echo "✅ Deploy successful!"
            else
              echo "❌ Health check failed!"
              exit 1
            fi
          DEPLOY
