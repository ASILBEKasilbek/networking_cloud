name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 13.213.12.202
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "🚀 Starting deployment..."
            cd /home/ubuntu/networking_cloud
            
            # Pull latest code
            git pull origin main
            
            # Rebuild and restart containers
            sudo docker compose up -d --build
            
            # Wait for web container to be healthy
            echo "⏳ Waiting for app to start..."
            sleep 20
            
            # Run migrations and setup
            sudo docker exec wholesale_app python manage.py migrate --noinput
            sudo docker exec wholesale_app python manage.py collectstatic --noinput
            sudo docker exec wholesale_app python manage.py create_demo_users
            
            # Verify deployment
            if curl -sf http://localhost:8001/health/ > /dev/null; then
              echo "✅ Deployment successful! App is healthy."
            else
              echo "❌ Health check failed!"
              sudo docker compose logs web --tail=20
              exit 1
            fi
