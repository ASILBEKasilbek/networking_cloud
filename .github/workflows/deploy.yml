name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/networking_cloud
            git pull origin main
            sudo docker compose up -d --build
            sudo docker exec wholesale_app python manage.py migrate --noinput
            sudo docker exec wholesale_app python manage.py collectstatic --noinput
            sudo docker exec wholesale_app python manage.py create_demo_users
            echo "✅ Deployment complete!"
